<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>gavagAI</title>
<script>
  // Старые ссылки вида common.html?type=person&id=platon и common.html?type=meeting&id=3
  (function () {
    var q = new URLSearchParams(location.search), type = q.get('type'), id = q.get('id') || '';
    var alias = { platon: 'plato' };
    var url = 'index.html';
    if (type === 'meeting' && id) url = 'meeting.html?id=' + encodeURIComponent(id);
    else if (type === 'person' && id) url = 'person.html?id=' + encodeURIComponent(alias[id] || id);
    location.replace(url);
  })();
</script>
</head>
<body>
<p>Страница переехала: <a href="index.html">на главную</a>.</p>
</body>
</html>
